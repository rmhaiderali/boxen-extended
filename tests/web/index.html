<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Boxen Extended</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Cascadia+Mono:wght@350&display=swap");

      html {
        width: max-content;
      }

      .terminal {
        font-size: 16px;
        white-space: pre;
        font-weight: 350;
        min-width: fit-content;
        font-family: "Cascadia Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div class="terminal"><span>Loading</span></div>
    <script type="module">
      import { AnsiUp } from "https://cdn.jsdelivr.net/npm/ansi_up@6.0.6/+esm"
      import boxenExtended from "./index.js"

      const terminal = document.querySelector(".terminal")

      const ansi_up = new AnsiUp()

      const result = boxenExtended(
        123,
        "Alice",
        ["one", "two"],
        { foo: "bar" },
        () => "hello world",
      )

      terminal.innerHTML = ansi_up.ansi_to_html(result)

      console.log(result)
    </script>
  </body>
</html>
