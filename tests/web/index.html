  <body>
    <div class="terminal"><span>Loading</span></div>
    <script type="module">
      import { AnsiUp } from "https://cdn.jsdelivr.net/npm/ansi_up@6.0.6/+esm"
      import boxenExtended from "./index.js"

      const terminal = document.querySelector(".terminal")

      const loadingWidth = terminal
        .querySelector("span")
        .getBoundingClientRect().width

      const symbols = document.createElement("span")
      symbols.style.visibility = "hidden"
      symbols.textContent = "───────"
      terminal.appendChild(symbols)

      const symbolsWidth = symbols.getBoundingClientRect().width

      if (loadingWidth !== symbolsWidth) {
        symbols.style.fontFamily = "Google Sans Code Symbols2, monospace"

        const fallbackSymbolsWidth = symbols.getBoundingClientRect().width

        if (loadingWidth.toFixed(1) === fallbackSymbolsWidth.toFixed(1))
          terminal.style.fontFamily = "Google Sans Code Symbols2, monospace"
      }

      const ansi_up = new AnsiUp()

      const result = boxenExtended(
        123,
        "Alice",
        ["one", "two"],
        { foo: "bar" },
        () => "hello world",
      )

      terminal.innerHTML = ansi_up.ansi_to_html(result)

      console.log(result)
    </script>
